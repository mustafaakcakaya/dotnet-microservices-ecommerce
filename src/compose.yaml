version: '3.4'

services:
  catalogdb:
    image: postgres:18
    container_name: catalogdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CatalogDb
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CatalogDb"]
      interval: 5s
      timeout: 5s
      retries: 10
  basketdb:
    image: postgres:18
    container_name: basketdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=BasketDb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BasketDb"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  distributedcache:
    image: redis:8-alpine
    container_name: distributedcache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  orderdb:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: orderdb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SwN12345678
      # SQL Server Agent is required by the CDC capture job that feeds Ordering.Worker.
      - MSSQL_AGENT_ENABLED=true
      # Pin the edition explicitly: CDC needs Developer/Standard/Enterprise.
      # Express silently lacks CDC, and the worker would never see a change.
      - MSSQL_PID=Developer
    restart: always
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  messagebroker:
    image: rabbitmq:3-management
    container_name: messagebroker
    hostname: ecommerce-mq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Optional broker: `docker compose --profile kafka up`.
  # Switch the worker over with MessageBroker__Provider=Kafka.
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    profiles: ["kafka"]
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    restart: always
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  catalog.api:
    container_name: Catalog.API
    # Image name is parameterized so we can easily push to different registries.
    # If DOCKER_REGISTRY is not set, image will simply be "catalogapi".
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://0.0.0.0:8081;http://0.0.0.0:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/catalog-api.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=catalog_dev_cert_password
      - ConnectionStrings__Database=Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;Include Error Detail=true
    depends_on:
      catalogdb:
        condition: service_healthy
    ports:
      - "6000:8080"
      - "6060:8081"
    volumes:
      # Allow overriding secrets and https cert paths per OS/environment.
      # Defaults work for macOS/Linux; on Windows you can set these in a .env file.
      - ${USERSECRETS_PATH:-~/.microsoft/usersecrets}:/home/app/.microsoft/usersecrets:ro
      - ${HTTPS_CERTS_PATH:-~/.aspnet/https}:/https:ro

  basket.api:
    container_name: Basket.API
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://0.0.0.0:8081;http://0.0.0.0:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/basket-api.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=basket_dev_cert_password
      - ConnectionStrings__Database=Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=postgres;Include Error Detail=true
      - ConnectionStrings__Redis=distributedcache:6379
      - GrpcSettings__DiscountUrl=http://discount.grpc:8080
      - MessageBroker__Provider=RabbitMq
      - MessageBroker__RabbitMq__Host=amqp://messagebroker:5672
      - MessageBroker__RabbitMq__UserName=guest
      - MessageBroker__RabbitMq__Password=guest
    depends_on:
      basketdb:
        condition: service_healthy
      distributedcache:
        condition: service_healthy
      discount.grpc:
        condition: service_started
      messagebroker:
        condition: service_healthy
    ports:
      - "6001:8080"
      - "6061:8081"
    volumes:
      - ${USERSECRETS_PATH:-~/.microsoft/usersecrets}:/home/app/.microsoft/usersecrets:ro
      - ${HTTPS_CERTS_PATH:-~/.aspnet/https}:/https:ro

  discount.grpc:
    container_name: Discount.Grpc
    image: ${DOCKER_REGISTRY-}discountgrpc
    build:
      context: .
      dockerfile: Services/Discount/Discount.Grpc/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://0.0.0.0:8081;http://0.0.0.0:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/discount-grpc.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=discount_dev_cert_password
      - ConnectionStrings__DefaultConnection=Data Source=discount.db
    ports:
      - "6002:8080"
      - "6062:8081"
    volumes:
      - ${USERSECRETS_PATH:-~/.microsoft/usersecrets}:/home/app/.microsoft/usersecrets:ro
      - ${HTTPS_CERTS_PATH:-~/.aspnet/https}:/https:ro

  ordering.api:
    container_name: Ordering.API
    image: ${DOCKER_REGISTRY-}orderingapi
    build:
      context: .
      dockerfile: Services/Ordering/Ordering.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://0.0.0.0:8081;http://0.0.0.0:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/ordering-api.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=ordering_dev_cert_password
      - ConnectionStrings__Database=Server=orderdb;Database=OrderDb;User Id=sa;Password=SwN12345678;Encrypt=False;TrustServerCertificate=True
      - MessageBroker__Provider=RabbitMq
      - MessageBroker__RabbitMq__Host=amqp://messagebroker:5672
      - MessageBroker__RabbitMq__UserName=guest
      - MessageBroker__RabbitMq__Password=guest
      - FeatureManagement__OrderFulfillment=false
    depends_on:
      orderdb:
        condition: service_healthy
      messagebroker:
        condition: service_healthy
    ports:
      - "6003:8080"
      - "6063:8081"
    volumes:
      - ${USERSECRETS_PATH:-~/.microsoft/usersecrets}:/home/app/.microsoft/usersecrets:ro
      - ${HTTPS_CERTS_PATH:-~/.aspnet/https}:/https:ro

  # Single CDC listener instance on purpose: two instances sharing a ConsumerName
  # would republish each other's messages (see docs/adr/0002-cdc-worker-single-instance.md).
  ordering.worker:
    container_name: Ordering.Worker
    image: ${DOCKER_REGISTRY-}orderingworker
    build:
      context: .
      dockerfile: Services/Ordering/Ordering.Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__Database=Server=orderdb;Database=OrderDb;User Id=sa;Password=SwN12345678;Encrypt=False;TrustServerCertificate=True
      # Set to Kafka (with the kafka profile running) to publish to Kafka instead.
      - MessageBroker__Provider=${MESSAGE_BROKER_PROVIDER:-RabbitMq}
      - MessageBroker__RabbitMq__Host=amqp://messagebroker:5672
      - MessageBroker__RabbitMq__UserName=guest
      - MessageBroker__RabbitMq__Password=guest
      - MessageBroker__Kafka__BootstrapServers=kafka:9092
    depends_on:
      orderdb:
        condition: service_healthy
      messagebroker:
        condition: service_healthy
    ports:
      - "6005:8080"

  yarpapigateway:
    container_name: YarpApiGateway
    image: ${DOCKER_REGISTRY-}yarpapigateway
    build:
      context: .
      dockerfile: ApiGateways/YarpApiGateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://0.0.0.0:8081;http://0.0.0.0:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/yarp-api-gateway.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=yarp_gateway_dev_cert_password
    depends_on:
      - catalog.api
      - basket.api
      - ordering.api
    ports:
      - "6004:8080"
      - "6064:8081"
    volumes:
      - ${USERSECRETS_PATH:-~/.microsoft/usersecrets}:/home/app/.microsoft/usersecrets:ro
      - ${HTTPS_CERTS_PATH:-~/.aspnet/https}:/https:ro

volumes:
  postgres_catalog:
  postgres_basket:
  redis_data:
